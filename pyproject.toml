[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "edge_rust"
version = "0.1.0"
description = "edgeR quasi-likelihood differential expression for the Mass Dynamics platform: Rust core, Python orchestration, no R."
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Mass Dynamics", email = "engineering@massdynamics.com" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
]

[dependency-groups]
# A group, not an extra: a bare `uv sync` installs it, so `uv run pytest` works on a fresh
# checkout (review r2, R2-8).
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[tool.maturin]
python-source = "python"
module-name = "edge_rust._core"
manifest-path = "crates/edger-py/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
# Rebuild the extension on `uv run` when the Rust sources change (review r1, R4).
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "crates/**/Cargo.toml" },
  { file = "crates/**/*.rs" },
]
