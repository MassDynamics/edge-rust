[package]
name = "edger-py"
description = "PyO3 bindings for edger-core, built with maturin into `edge_rust._core`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
edger-core = { path = "../edger-core" }
rnum = { path = "../rnum" }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py311"] }
numpy = "0.24"
